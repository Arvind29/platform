# Dialogue Branch BFF (Backend-for-Frontend) — Spring Boot configuration.
#
# All dlb.bff.* properties can be overridden at runtime via environment variables:
#   dlb.bff.oauth2-client-id             → DLB_BFF_OAUTH2_CLIENT_ID
#   dlb.bff.oauth2-client-secret          → DLB_BFF_OAUTH2_CLIENT_SECRET
#   dlb.bff.keycloak-base-url             → DLB_BFF_KEYCLOAK_BASE_URL
#   dlb.bff.keycloak-browser-base-url     → DLB_BFF_KEYCLOAK_BROWSER_BASE_URL
#   dlb.bff.keycloak-realm                → DLB_BFF_KEYCLOAK_REALM
#   dlb.bff.api-base-url                  → DLB_BFF_API_BASE_URL
#   dlb.bff.web-service-client-id         → DLB_BFF_WEB_SERVICE_CLIENT_ID
#   dlb.bff.post-login-redirect-url       → DLB_BFF_POST_LOGIN_REDIRECT_URL
#   dlb.bff.mariadb.host                  → DLB_BFF_MARIADB_HOST
#   dlb.bff.mariadb.password              → DLB_BFF_MARIADB_PASSWORD
#   dlb.bff.session-timeout               → DLB_BFF_SESSION_TIMEOUT
#
# The keycloak ClientRegistration itself is built by hand in SecurityConfig from these same
# properties, not auto-configured from spring.security.oauth2.client.* — see its Javadoc for why
# (in short: end_session_endpoint has to be supplied directly, since this app deliberately never
# triggers OIDC discovery).
#
# The defaults below are tuned for local development (infrastructure/docker/compose.yml).
# Production deployments must override the client id/secret via environment variables.

server:
  port: 8082
  # Trust X-Forwarded-Proto/Host from a reverse proxy in front of this service, so absolute URLs
  # Spring Security builds itself (redirect_uri, post_logout_redirect_uri) use https:// there
  # instead of http://, matching the https-only redirect URIs registered in Keycloak. No-op when
  # there's no reverse proxy in front (e.g. local development).
  forward-headers-strategy: framework
  servlet:
    session:
      # Inactivity timeout for the server-side session persisted to MariaDB. Single-sourced from
      # dlb.bff.session-timeout below, along with cookie.max-age, so they can't drift apart.
      timeout: ${dlb.bff.session-timeout}
      cookie:
        # The browser's own clock for the SESSION cookie — no expiry by default otherwise (a
        # plain browser-session cookie). Re-issued each request by SessionCookieRefreshFilter so
        # it slides forward with the timeout above instead of hard-expiring regardless of activity.
        max-age: ${dlb.bff.session-timeout}

spring:
  # Persists sessions to MariaDB instead of this JVM's heap, so a redeploy doesn't drop every
  # signed-in user (see SecurityConfig's Javadoc). Its own database, not dlb-web-service's — this
  # service otherwise owns no persistent data, and Spring Session's tables don't belong in that
  # service's Flyway-managed schema.
  datasource:
    url: jdbc:mariadb://${dlb.bff.mariadb.host}:${dlb.bff.mariadb.port}/${dlb.bff.mariadb.database}?createDatabaseIfNotExist=true
    username: ${dlb.bff.mariadb.user}
    password: ${dlb.bff.mariadb.password}
    driver-class-name: org.mariadb.jdbc.Driver
  session:
    store-type: jdbc
    jdbc:
      # "always", not the default "embedded" — that only auto-creates SPRING_SESSION* against an
      # in-memory test database, never a real one like this.
      initialize-schema: always

dlb:
  bff:
    oauth2-client-id: ${DLB_BFF_OAUTH2_CLIENT_ID:dlb-bff}
    oauth2-client-secret: ${DLB_BFF_OAUTH2_CLIENT_SECRET:dev-secret}
    # Server-to-server Keycloak address (token exchange, ID token signature verification).
    keycloak-base-url: ${DLB_BFF_KEYCLOAK_BASE_URL:http://localhost:8081/}
    # Browser-facing Keycloak address for login/logout redirects — differs from the one above only
    # when this service runs in a container network with its own internal Keycloak hostname.
    # Deliberately no issuer-uri/OIDC discovery: the internal and browser-facing addresses disagree
    # on the issuer, which would break real logins — Spring tolerates the missing issuer-uri/
    # user-info-uri fine.
    keycloak-browser-base-url: ${DLB_BFF_KEYCLOAK_BROWSER_BASE_URL:http://localhost:8081/}
    keycloak-realm: ${DLB_BFF_KEYCLOAK_REALM:dialoguebranch}
    # Internal address of the Dialogue Branch Web Service that ApiProxyController forwards
    # /api/** to — never browser-facing, the browser only ever talks to this BFF.
    api-base-url: ${DLB_BFF_API_BASE_URL:http://localhost:8089/dlb-web-service}
    # The Keycloak client id whose resource_access roles WhoAmIController reads for the current
    # user — this is the dlb-web-service client's id itself (a role container, not something this
    # BFF logs in as), kept configurable rather than hard-coded to survive a differently-named
    # realm/client setup.
    web-service-client-id: ${DLB_BFF_WEB_SERVICE_CLIENT_ID:dlb-web-service}
    # Where SecurityConfig sends the browser after login/logout (same value for both: the SPA's
    # own origin). The relative default ("/") works behind a same-origin proxy (production) but
    # not in local dev, where Keycloak's absolute redirect would land on this BFF's own port
    # instead of the SPA's dev server — override to the dev server's origin there (see
    # compose.yml). Must also be registered as a post-logout redirect URI for the dlb-bff client.
    post-login-redirect-url: ${DLB_BFF_POST_LOGIN_REDIRECT_URL:/}
    # How long an inactive session (and its cookie) stays valid — read by the
    # server.servlet.session block above. Boot's own default (30 minutes) is easy to hit
    # mid-session; 7d suits something like Studio, where visits can be days apart.
    session-timeout: ${DLB_BFF_SESSION_TIMEOUT:7d}
    # ---- Session storage (see the spring.datasource/spring.session block above) ----
    mariadb:
      host: localhost
      port: 3306
      user: root
      password: dev # matches infrastructure/docker/compose.yml
      database: dlb_bff_sessions

management:
  endpoints:
    web:
      exposure:
        include: health,info
