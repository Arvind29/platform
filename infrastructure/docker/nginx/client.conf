# Reverse proxy for the "client" Compose profile (see ../compose.yml) — the single entry point a
# browser talks to when running the web client (apps/web) and the BFF (apps/bff) fully
# containerized, mirroring a real deployment where one reverse proxy fronts both. The web client
# and BFF must be same-origin (shared session cookie, no CORS) — see apps/bff's own SecurityConfig
# Javadoc for why.
#
# Path list below must match apps/bff's own end-points exactly (SecurityConfig.java,
# ApiProxyController.java, WhoAmIController.java) — everything else falls through to the static
# web client build.

server {
    listen 80;

    # Preserve the browser's real Host (and add the standard forwarded-proto header) rather than
    # letting the upstream see this proxy's own address — apps/bff's `forward-headers-strategy:
    # framework` (application.yml) relies on these to compute absolute redirect_uri/
    # post_logout_redirect_uri values that match this proxy's own origin, not bff-client's internal
    # one. Losing this (e.g. via a proxy that rewrites Host to the upstream target) is exactly why
    # the "run client+BFF outside Docker" dev flow needs its own explicit
    # DLB_BFF_POST_LOGIN_REDIRECT_URL override instead — see compose.yml's `bff` service.
    #
    # $http_host (not $host, and no separate X-Forwarded-Port) deliberately: $host silently drops
    # the port the browser actually used, and $server_port is nginx's own internal listen port
    # (80), not the externally-mapped host port (8080) — nginx has no way to know that mapping on
    # its own. $http_host is the verbatim Host header the browser sent, port included, which is
    # exactly what Spring's ForwardedHeaderFilter needs in X-Forwarded-Host to get this right; a
    # separate X-Forwarded-Port would be redundant with (and risk conflicting with) the port
    # already embedded in it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    location /api/ {
        proxy_pass http://bff-client:8082;
    }

    location /oauth2/ {
        proxy_pass http://bff-client:8082;
    }

    location /login {
        proxy_pass http://bff-client:8082;
    }

    location /logout {
        proxy_pass http://bff-client:8082;
    }

    location /whoami {
        proxy_pass http://bff-client:8082;
    }

    location /actuator/ {
        proxy_pass http://bff-client:8082;
    }

    location / {
        proxy_pass http://web:80;
    }
}
